```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animación Verde</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background: #050505;
            font-family: Arial, sans-serif;
        }

        /* Fondo */
        .fondo {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .luz {
            position: absolute;
            width: 300px;
            height: 300px;

            background: #00ff66;
            border-radius: 50%;

            filter: blur(100px);
            opacity: 0.25;

            animation: movimiento 8s infinite alternate ease-in-out;
        }

        .luz:nth-child(1) {
            top: 10%;
            left: 10%;
        }

        .luz:nth-child(2) {
            right: 10%;
            bottom: 10%;

            animation-delay: -3s;
            animation-duration: 10s;
        }

        @keyframes movimiento {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(200px, -100px) scale(1.3);
            }

            100% {
                transform: translate(-100px, 150px) scale(0.8);
            }
        }

        /* Contenedor */
        .contenedor {
            position: relative;
            z-index: 2;

            width: 400px;
            padding: 40px;

            text-align: center;

            background: rgba(10, 20, 15, 0.8);
            border: 1px solid rgba(0, 255, 102, 0.4);
            border-radius: 20px;

            box-shadow:
                0 0 30px rgba(0, 255, 102, 0.15),
                inset 0 0 30px rgba(0, 255, 102, 0.03);

            backdrop-filter: blur(10px);
        }

        h1 {
            color: #00ff66;
            margin-bottom: 15px;

            text-shadow:
                0 0 10px #00ff66,
                0 0 30px rgba(0, 255, 102, 0.5);
        }

        p {
            color: #b8cfc1;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 25px;

            border: 1px solid #00ff66;
            border-radius: 8px;

            background: transparent;
            color: #00ff66;

            font-size: 16px;
            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: #00ff66;
            color: #050505;

            box-shadow:
                0 0 15px #00ff66,
                0 0 40px rgba(0, 255, 102, 0.5);
        }

        /* EMOJIS */

        .emoji {
            position: fixed;

            bottom: -50px;

            font-size: 35px;

            pointer-events: none;

            z-index: 10;

            animation: subirEmoji 3s ease-out forwards;
        }

        @keyframes subirEmoji {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg)
                    scale(0.5);

                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            50% {
                transform:
                    translateY(-50vh)
                    rotate(180deg)
                    scale(1.2);
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg)
                    scale(0.8);

                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Fondo -->
    <div class="fondo">
        <div class="luz"></div>
        <div class="luz"></div>
    </div>

    <!-- Contenido -->
    <div class="contenedor">

        <h1>Animación Verde</h1>

        <p>
            Presiona el botón para lanzar emojis 🎉
        </p>

        <button id="boton">
            ¡Lanzar emojis!
        </button>

    </div>


    <script>

        const boton = document.querySelector("#boton");


        // Lista de emojis disponibles

        const emojis = [
            "😀",
            "😂",
            "😍",
            "🤩",
            "🥳",
            "😎",
            "🔥",
            "💚",
            "✨",
            "🎉",
            "🚀",
            "⭐",
            "🍀",
            "💫",
            "🎊",
            "👏",
            "🙌",
            "❤️",
            "💎",
            "🌟"
        ];


        // Función para obtener un emoji aleatorio

        function emojiAleatorio() {

            const posicion =
                Math.floor(Math.random() * emojis.length);

            return emojis[posicion];
        }


        // Crear un emoji

        function crearEmoji() {

            const emoji =
                document.createElement("div");

            emoji.classList.add("emoji");


            // Elegir emoji

            emoji.textContent =
                emojiAleatorio();


            // Posición horizontal aleatoria

            emoji.style.left =
                Math.random() * 100 + "vw";


            // Tamaño aleatorio

            const tamaño =
                Math.random() * 30 + 25;

            emoji.style.fontSize =
                tamaño + "px";


            // Duración aleatoria

            emoji.style.animationDuration =
                Math.random() * 2 + 2 + "s";


            // Agregar a la página

            document.body.appendChild(emoji);


            // Eliminar después de la animación

            setTimeout(() => {

                emoji.remove();

            }, 4000);

        }


        // Al presionar el botón

        boton.addEventListener("click", () => {

            // Crear entre 10 y 20 emojis

            const cantidad =
                Math.floor(Math.random() * 11) + 10;


            for (let i = 0; i < cantidad; i++) {

                // Pequeño retraso para que
                // no aparezcan todos al mismo tiempo

                setTimeout(() => {

                    crearEmoji();

                }, i * 80);

            }

        });

    </script>

</body>
</html>
```
