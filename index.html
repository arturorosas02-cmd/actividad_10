```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animación Verde</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background: #050505;
            font-family: Arial, sans-serif;
        }

        /* Fondo animado */
        .fondo {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .luz {
            position: absolute;
            width: 300px;
            height: 300px;

            background: #00ff66;
            border-radius: 50%;

            filter: blur(100px);
            opacity: 0.25;

            animation: movimiento 8s infinite alternate ease-in-out;
        }

        .luz:nth-child(1) {
            top: 10%;
            left: 10%;
        }

        .luz:nth-child(2) {
            right: 10%;
            bottom: 10%;

            animation-delay: -3s;
            animation-duration: 10s;
        }

        @keyframes movimiento {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(200px, -100px) scale(1.3);
            }

            100% {
                transform: translate(-100px, 150px) scale(0.8);
            }
        }

        /* Contenedor principal */
        .contenedor {
            position: relative;
            z-index: 2;

            width: 400px;
            padding: 40px;

            text-align: center;

            background: rgba(10, 20, 15, 0.8);
            border: 1px solid rgba(0, 255, 102, 0.4);
            border-radius: 20px;

            box-shadow:
                0 0 30px rgba(0, 255, 102, 0.15),
                inset 0 0 30px rgba(0, 255, 102, 0.03);

            backdrop-filter: blur(10px);
        }

        h1 {
            color: #00ff66;
            margin-bottom: 15px;

            text-shadow:
                0 0 10px #00ff66,
                0 0 30px rgba(0, 255, 102, 0.5);
        }

        p {
            color: #b8cfc1;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 25px;

            border: 1px solid #00ff66;
            border-radius: 8px;

            background: transparent;
            color: #00ff66;

            font-size: 16px;
            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: #00ff66;
            color: #050505;

            box-shadow:
                0 0 15px #00ff66,
                0 0 40px rgba(0, 255, 102, 0.5);
        }

        /* Efecto de partículas */
        .particula {
            position: absolute;

            width: 4px;
            height: 4px;

            background: #00ff66;
            border-radius: 50%;

            box-shadow: 0 0 10px #00ff66;

            animation: subir linear infinite;
        }

        @keyframes subir {
            from {
                transform: translateY(100vh);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            to {
                transform: translateY(-20px);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Luces del fondo -->
    <div class="fondo">
        <div class="luz"></div>
        <div class="luz"></div>
    </div>

    <!-- Contenido -->
    <div class="contenedor">
        <h1>Animación Verde</h1>

        <p>
            HTML + CSS + JavaScript
        </p>

        <button id="boton">
            Activar efecto
        </button>
    </div>

    <script>
        const fondo = document.querySelector(".fondo");
        const boton = document.querySelector("#boton");

        // Crear partículas
        function crearParticulas(cantidad) {

            for (let i = 0; i < cantidad; i++) {

                const particula = document.createElement("div");

                particula.classList.add("particula");

                // Posición horizontal aleatoria
                particula.style.left = Math.random() * 100 + "%";

                // Duración aleatoria
                particula.style.animationDuration =
                    (Math.random() * 5 + 4) + "s";

                // Retraso aleatorio
                particula.style.animationDelay =
                    Math.random() * 5 + "s";

                // Tamaño aleatorio
                const tamaño =
                    Math.random() * 4 + 2;

                particula.style.width = tamaño + "px";
                particula.style.height = tamaño + "px";

                fondo.appendChild(particula);
            }
        }

        crearParticulas(40);

        // Interacción con el botón
        boton.addEventListener("click", () => {

            document.body.classList.toggle("activo");

            boton.textContent =
                document.body.classList.contains("activo")
                    ? "Efecto activado"
                    : "Activar efecto";
        });
    </script>

</body>
</html>
