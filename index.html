<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pensamiento Computacional y Programación</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fondo de partículas */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Contenedor principal */
        .contenedor {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 900px;
            padding: 60px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: aparecer 1.5s ease;
        }

        h1 {
            font-size: clamp(2.5rem, 7vw, 5rem);
            line-height: 1.1;
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow:
                0 0 10px #38bdf8,
                0 0 25px #38bdf8,
                0 0 50px #8b5cf6;
            animation: flotar 3s ease-in-out infinite;
        }

        .subtitulo {
            font-size: 1.3rem;
            color: #c4b5fd;
            margin-bottom: 35px;
        }

        .codigo {
            display: inline-block;
            padding: 15px 25px;
            border-radius: 15px;
            background: #020617;
            color: #38bdf8;
            font-family: "Courier New", monospace;
            font-size: 1.1rem;
            box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .boton {
            margin-top: 35px;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(90deg, #06b6d4, #8b5cf6);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .boton:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px #38bdf8;
        }

        /* Emoji que aparece al hacer clic */
        .emoji {
            position: fixed;
            pointer-events: none;
            font-size: 35px;
            z-index: 10;
            animation: subir 1.5s ease-out forwards;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: scale(0.7) translateY(50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes flotar {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes subir {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }

            100% {
                opacity: 0;
                transform: translateY(-150px) scale(1.8) rotate(30deg);
            }
        }

        @media (max-width: 600px) {
            .contenedor {
                padding: 40px 20px;
            }

            .subtitulo {
                font-size: 1rem;
            }

            .codigo {
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>

    <canvas id="canvas"></canvas>

    <div class="contenedor">
        <h1>Pensamiento Computacional<br>y Programación</h1>

        <p class="subtitulo">
            💡 ¡Piensa, crea, programa y diviértete!
        </p>

        <div class="codigo">
            &lt;h1&gt;¡Hola, programador!&lt;/h1&gt;
        </div>

        <br>

        <button class="boton" id="boton">
            🚀 ¡Haz clic!
        </button>
    </div>

    <script>
        // ==========================================
        // ANIMACIÓN DE PARTÍCULAS
        // ==========================================

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let particulas = [];

        function ajustarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener("resize", ajustarCanvas);
        ajustarCanvas();

        // Crear partículas
        for (let i = 0; i < 100; i++) {
            particulas.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                tamaño: Math.random() * 3 + 1,
                velocidadX: (Math.random() - 0.5) * 1.5,
                velocidadY: (Math.random() - 0.5) * 1.5,
                color: Math.random() > 0.5 ? "#38bdf8" : "#a78bfa"
            });
        }

        function animarParticulas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particulas.forEach(p => {
                p.x += p.velocidadX;
                p.y += p.velocidadY;

                // Si sale de la pantalla, vuelve a aparecer
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.tamaño, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = p.color;
                ctx.fill();
            });

            // Dibujar líneas entre partículas cercanas
            for (let i = 0; i < particulas.length; i++) {
                for (let j = i + 1; j < particulas.length; j++) {

                    const dx = particulas[i].x - particulas[j].x;
                    const dy = particulas[i].y - particulas[j].y;
                    const distancia = Math.sqrt(dx * dx + dy * dy);

                    if (distancia < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particulas[i].x, particulas[i].y);
                        ctx.lineTo(particulas[j].x, particulas[j].y);

                        ctx.strokeStyle =
                            "rgba(129, 140, 248, " +
                            (1 - distancia / 120) * 0.4 +
                            ")";

                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animarParticulas);
        }

        animarParticulas();


        // ==========================================
        // ANIMACIÓN AL HACER CLIC
        // ==========================================

        const boton = document.getElementById("boton");

        const emojis = ["💻", "🚀", "🧠", "⚡", "🤖", "💡", "🎮", "✨"];

        boton.addEventListener("click", function(event) {

            for (let i = 0; i < 12; i++) {

                const emoji = document.createElement("div");

                emoji.classList.add("emoji");

                emoji.textContent =
                    emojis[Math.floor(Math.random() * emojis.length)];

                emoji.style.left =
                    (event.clientX + (Math.random() - 0.5) * 150) + "px";

                emoji.style.top =
                    (event.clientY + (Math.random() - 0.5) * 50) + "px";

                emoji.style.animationDuration =
                    (1 + Math.random() * 1) + "s";

                document.body.appendChild(emoji);

                setTimeout(() => {
                    emoji.remove();
                }, 2000);
            }

            // Cambiar temporalmente el texto
            boton.textContent = "🎉 ¡Programando!";
            
            setTimeout(() => {
                boton.textContent = "🚀 ¡Haz clic!";
            }, 1500);
        });
    </script>

</body>
</html>
